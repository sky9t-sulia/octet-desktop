[package]
name = "octet-desktop"
version = "0.9.0"
description = "Octet: a NES emulator for the desktop."
authors = ["sky9t-sulia"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "octet_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# The dialog plugin defaults to rfd's `gtk3` backend, which draws GTK's own
# old FileChooser rather than the one the desktop provides. `xdg-portal` goes
# through org.freedesktop.portal.FileChooser instead, so the picker is the
# session's real dialog — Nautilus-style under GNOME, Dolphin's under KDE —
# and works natively on Wayland and inside a sandbox.
tauri-plugin-dialog = { version = "2", default-features = false, features = [
    "xdg-portal",
] }
# The emulator core, beside this repository. Default features give it `std`
# and save states; the JNI bridge is Android's and stays off every other target.
octet-emu = { path = "../../octet-emu" }

# The sound device. The emulator is paced against it, so a frame is produced
# when the speaker is ready for one rather than when a timer says so.
cpal = "0.15"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8.2.0"
png = "0.18.1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
